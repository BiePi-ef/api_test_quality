name: Tests CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install
  
  build:
    steps:
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format -- --check

      - name: Run tests (with coverage)
        env:
          CI: true
        run: npm test -- --coverage
